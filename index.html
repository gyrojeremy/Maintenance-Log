<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maintenance Log</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="theme-color" content="#F5B921" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Maintenance Log" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #1B1D1C; }
  </style>
</head>
<body>
  <div id="lock-screen" style="position:fixed;inset:0;background:#1B1D1C;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;">
    <div style="width:100%;max-width:320px;">
      <h1 style="color:#F3EFE6;font-size:22px;margin:0 0 4px;">Maintenance Log</h1>
      <p style="color:#9A9C92;font-size:14px;margin:0 0 20px;">Enter the crew password to continue.</p>
      <input id="lock-input" type="password" placeholder="Password" autocomplete="off"
        style="width:100%;box-sizing:border-box;background:#1A1917;border:1px solid #3A3D39;color:#F3EFE6;border-radius:4px;padding:10px 12px;font-size:15px;margin-bottom:10px;" />
      <div id="lock-error" style="color:#BC5238;font-size:13px;margin-bottom:10px;display:none;">Wrong password — try again.</div>
      <button id="lock-submit" style="width:100%;background:#8FAE3E;color:#1A1917;border:none;border-radius:4px;padding:11px;font-weight:600;font-size:15px;">Unlock</button>
    </div>
  </div>

  <script>
    (function () {
      // Change this line to set the crew's password.
      var SHEDLOG_PASSWORD = "Welder2016!";

      var lock = document.getElementById("lock-screen");
      if (localStorage.getItem("shedlog_authed") === "true") {
        lock.style.display = "none";
      }
      var input = document.getElementById("lock-input");
      var error = document.getElementById("lock-error");
      function tryUnlock() {
        if (input.value === SHEDLOG_PASSWORD) {
          localStorage.setItem("shedlog_authed", "true");
          lock.style.display = "none";
        } else {
          error.style.display = "block";
          input.value = "";
          input.focus();
        }
      }
      document.getElementById("lock-submit").addEventListener("click", tryUnlock);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") tryUnlock();
      });
    })();
  </script>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="storage-shim.js?v=1791145578"></script>
  <script src="app.js?v=1791145578"></script>
</body>
</html>
